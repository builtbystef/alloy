name: Images

# Builds the API and web images and pushes them to GitHub Container Registry
# once CI has passed on main, so every image is a tested commit. Tags: `latest`
# and `sha-<short sha>`. For hosts that pull images; hosts that build from the
# repository (Railway, Render, Fly) use the Dockerfiles directly and ignore this.
#
# Images land at ghcr.io/<owner>/<repo>/api and .../web. A package is private
# by default; make it public or give the server a token with `read:packages`
# (see Deploying in the README).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Build any ref by hand, for example to test a Dockerfile change on a branch.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On workflow_run, github.sha is the tip of main, which may have moved.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cases the repository name (registries require it) and derives the
      # tags. `latest` only for main, so a workflow_dispatch on a branch
      # publishes a sha tag alone.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ (github.event.workflow_run.head_branch || github.ref_name) == 'main' }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build stages' layers, cached in the registry, so a source-only
          # change rebuilds neither the dependency install nor the base images.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.name }}:buildcache,mode=max
