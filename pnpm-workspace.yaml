packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^7.0.2
  # Bump these two together; a mismatched pair fails at startup. Dependabot
  # cannot see the coupling through the npm: alias, so update both by hand.
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Supply-chain policy.
minimumReleaseAge: 5760 # 4 days
strictDepBuilds: true
allowBuilds: {}
blockExoticSubdeps: true
trustPolicy: no-downgrade
verifyDepsBeforeRun: install
engineStrict: true
