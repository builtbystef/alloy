packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.7.0
  "@tailwindcss/postcss": ^4.3.3
  "@types/node": ^24
  class-variance-authority: ^0.7.1
  cn: ^0.2.4
  lucide-react: ^1.40.0
  postcss: ^8.5.27
  shadcn: ^4.20.1
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  # Bump these two together; a mismatched pair fails at startup. Dependabot
  # cannot see the coupling through the npm: alias, so update both by hand.
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Supply-chain policy.
minimumReleaseAge: 5760 # 4 days
strictDepBuilds: true
allowBuilds: {}
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Needed by shadcn via @babel/core. Old release without provenance.
  - semver@6.3.1
verifyDepsBeforeRun: install
engineStrict: true
