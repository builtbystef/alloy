# Local PostgreSQL for apps/api: `vp run db:up`. Credentials match the default
# ALLOY_DATABASE_URL and the CI service.
name: alloy

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: alloy
      POSTGRES_PASSWORD: alloy
      POSTGRES_DB: alloy
    ports:
      # Loopback only.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 stores data under /var/lib/postgresql/<major>, not .../data.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username alloy --dbname alloy"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
